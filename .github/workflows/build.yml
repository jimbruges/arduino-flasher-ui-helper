name: Native desktop builds
permissions:
  contents: read
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [macos-14, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libusb-1.0-0-dev libxml2-dev pkg-config
      - name: Mac tool dependencies
        if: runner.os == 'macOS'
        run: brew install libusb libxml2 pkg-config
      - run: go test -race ./internal/...
      - name: Windows cancellation test
        if: runner.os == 'Windows'
        run: go test ./internal/provision -run TestWindowsCancellation
      - run: scripts/build-tools.sh
        shell: bash
      - run: scripts/build.sh
        shell: bash
      - name: Package downloadable builds
        run: scripts/package.sh
        shell: bash
      # Source/relinking companions must be supplied before publishing binaries.
      - uses: actions/upload-artifact@v4
        if: vars.PUBLISH_BINARY_ARTIFACTS == 'true'
        with:
          name: arduino-flasher-ui-helper-${{ runner.os }}
          path: |
            build/*.zip
            build/*.tar.gz
          if-no-files-found: error
